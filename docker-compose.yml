version: '3.9'

services:
  backend:
    container_name: my_backend
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "8000:80"
    command: sh -c "aerich init -db && uvicorn main:app --host 0.0.0.0 --port 80"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    container_name: my_postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
